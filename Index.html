<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If Pride — Elite Discord Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a84c;
            --gold-light: #e8d48b;
            --gold-pale: #f5ecd0;
            --gold-dark: #a07c28;
            --gold-deep: #7d5f1a;
            --purple-deep: #0f0a1a;
            --purple-dark: #1a0f2e;
            --purple-mid: #251748;
            --purple-accent: #3d1f78;
            --charcoal: #0a0a0c;
            --dark-bg: #060509;
            --surface: rgba(255, 255, 255, 0.02);
            --surface-hover: rgba(255, 255, 255, 0.04);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(201, 168, 76, 0.12);
            --glass-border-hover: rgba(201, 168, 76, 0.25);
            --text: #ede8df;
            --text-dim: rgba(237, 232, 223, 0.55);
            --text-muted: rgba(237, 232, 223, 0.3);
            --glow-gold: rgba(201, 168, 76, 0.15);
            --glow-purple: rgba(61, 31, 120, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: var(--gold-dark) var(--charcoal);
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--charcoal); }
        ::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 10px; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--dark-bg);
            color: var(--text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ═══ AMBIENT BACKGROUND ═══ */
        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            will-change: transform;
        }

        .orb-1 {
            width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(201, 168, 76, 0.06), transparent 70%);
            top: -300px; right: -200px;
            animation: orbDrift1 25s ease-in-out infinite;
        }

        .orb-2 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(61, 31, 120, 0.12), transparent 70%);
            bottom: -200px; left: -200px;
            animation: orbDrift2 30s ease-in-out infinite;
        }

        .orb-3 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(201, 168, 76, 0.04), transparent 70%);
            top: 50%; left: 30%;
            animation: orbDrift3 35s ease-in-out infinite;
        }

        .orb-4 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(61, 31, 120, 0.08), transparent 70%);
            top: 20%; right: 10%;
            animation: orbDrift1 28s ease-in-out infinite reverse;
        }

        @keyframes orbDrift1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -60px) scale(1.05); }
            66% { transform: translate(-30px, 40px) scale(0.95); }
        }

        @keyframes orbDrift2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-50px, -30px) scale(1.08); }
            66% { transform: translate(60px, 20px) scale(0.92); }
        }

        @keyframes orbDrift3 {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(calc(-50% + 80px), calc(-50% - 50px)) scale(1.1); }
        }

        /* ═══ PARTICLES ═══ */
        #particle-canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* ═══ NOISE OVERLAY ═══ */
        .noise-overlay {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            opacity: 0.015;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
        }

        /* ═══ MAIN CONTENT WRAPPER ═══ */
        .content {
            position: relative;
            z-index: 10;
        }

        /* ═══ NAVIGATION ═══ */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nav.scrolled {
            padding: 0.8rem 3rem;
            background: rgba(6, 5, 9, 0.8);
            backdrop-filter: blur(30px) saturate(1.5);
            -webkit-backdrop-filter: blur(30px) saturate(1.5);
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 400;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--gold);
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nav-links a:hover { color: var(--gold-light); }
        .nav-links a:hover::after { width: 100%; }

        .nav-cta {
            padding: 0.55rem 1.6rem !important;
            background: linear-gradient(135deg, var(--gold-dark), var(--gold));
            color: var(--dark-bg) !important;
            font-weight: 600 !important;
            letter-spacing: 1.5px !important;
            border-radius: 3px;
            transition: all 0.4s ease !important;
            -webkit-text-fill-color: var(--dark-bg) !important;
            -webkit-background-clip: unset !important;
            background-clip: unset !important;
        }

        .nav-cta::after { display: none !important; }

        .nav-cta:hover {
            box-shadow: 0 4px 25px var(--glow-gold), 0 0 60px rgba(201, 168, 76, 0.1);
            transform: translateY(-1px);
        }

        .mobile-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
        }

        .mobile-toggle span {
            width: 22px;
            height: 1.5px;
            background: var(--gold);
            transition: all 0.3s ease;
            display: block;
        }

        .mobile-toggle.open span:nth-child(1) { transform: rotate(45deg) translateY(4.6px); }
        .mobile-toggle.open span:nth-child(2) { opacity: 0; }
        .mobile-toggle.open span:nth-child(3) { transform: rotate(-45deg) translateY(-4.6px); }

        /* ═══ MOBILE MENU ═══ */
        .mobile-menu {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 999;
            background: rgba(6, 5, 9, 0.96);
            backdrop-filter: blur(40px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .mobile-menu.open {
            opacity: 1;
            pointer-events: all;
        }

        .mobile-menu a {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--text);
            text-decoration: none;
            transition: color 0.3s ease;
            letter-spacing: 2px;
        }

        .mobile-menu a:hover { color: var(--gold); }

        /* ═══ HERO ═══ */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 6rem 2rem 4rem;
            position: relative;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.45rem 1.4rem;
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: revealUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        .badge-indicator {
            width: 5px;
            height: 5px;
            background: var(--gold);
            border-radius: 50%;
            animation: badgePulse 2.5s ease-in-out infinite;
            box-shadow: 0 0 8px var(--glow-gold);
        }

        @keyframes badgePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .badge-text {
            font-size: 0.65rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
            font-weight: 500;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-weight: 800;
            font-size: clamp(3rem, 9vw, 7.5rem);
            line-height: 0.95;
            letter-spacing: -1px;
            margin-bottom: 2rem;
            opacity: 0;
            animation: revealUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
        }

        .hero-title .line {
            display: block;
        }

        .hero-title .accent {
            background: linear-gradient(135deg, var(--gold-pale), var(--gold-light), var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
        }

        .hero-title .thin {
            font-weight: 400;
            font-style: italic;
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.65em;
            color: var(--text-dim);
            -webkit-text-fill-color: var(--text-dim);
            letter-spacing: 4px;
        }

        .hero-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1rem, 2vw, 1.35rem);
            color: var(--text-dim);
            max-width: 560px;
            line-height: 1.8;
            font-weight: 400;
            font-style: italic;
            margin-bottom: 3.5rem;
            opacity: 0;
            animation: revealUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
        }

        .hero-actions {
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
            justify-content: center;
            opacity: 0;
            animation: revealUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
        }

        /* ═══ BUTTONS ═══ */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 1rem 2.2rem;
            border-radius: 3px;
            cursor: pointer;
            border: none;
            transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
            color: var(--dark-bg);
        }

        .btn-gold::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s ease;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px var(--glow-gold), 0 0 80px rgba(201, 168, 76, 0.08);
        }

        .btn-gold:hover::before { left: 100%; }

        .btn-ghost {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .btn-ghost:hover {
            border-color: var(--glass-border-hover);
            background: rgba(201, 168, 76, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(201, 168, 76, 0.06);
        }

        .btn-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        /* ═══ SCROLL CUE ═══ */
        .scroll-cue {
            position: absolute;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            opacity: 0;
            animation: revealUp 1s ease 1.5s forwards;
        }

        .scroll-cue-text {
            font-size: 0.6rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .scroll-cue-line {
            width: 1px;
            height: 35px;
            position: relative;
            overflow: hidden;
        }

        .scroll-cue-line::after {
            content: '';
            position: absolute;
            top: -100%;
            left: 0;
            width: 1px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, var(--gold));
            animation: scrollLine 2s ease-in-out infinite;
        }

        @keyframes scrollLine {
            0% { top: -100%; }
            100% { top: 200%; }
        }

        /* ═══ SECTION SHARED ═══ */
        .section {
            padding: 8rem 2rem;
            position: relative;
        }

        .section-inner {
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-label {
            font-size: 0.65rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            font-weight: 500;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .section-label::before {
            content: '';
            width: 30px;
            height: 1px;
            background: linear-gradient(90deg, var(--gold), transparent);
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 4.5vw, 3.5rem);
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 1.2rem;
        }

        .section-desc {
            font-size: 1rem;
            color: var(--text-dim);
            max-width: 540px;
            line-height: 1.85;
            font-weight: 300;
        }

        .divider {
            max-width: 1200px;
            margin: 0 auto;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
        }

        /* ═══ REVEAL ANIMATIONS ═══ */
        @keyframes revealUp {
            from { opacity: 0; transform: translateY(35px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ═══ ABOUT SECTION ═══ */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5rem;
            align-items: center;
            margin-top: 4rem;
        }

        .about-visual {
            position: relative;
            display: flex;
            justify-content: center;
        }

        .emblem-frame {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 3 / 4;
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            background: linear-gradient(160deg, rgba(25, 15, 46, 0.6), rgba(6, 5, 9, 0.9));
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            position: relative;
            overflow: hidden;
        }

        .emblem-frame::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 30% 20%, rgba(201, 168, 76, 0.06), transparent 60%);
        }

        .emblem-glyph {
            font-family: 'Playfair Display', serif;
            font-size: 6rem;
            font-weight: 800;
            background: linear-gradient(180deg, var(--gold-light), var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
            text-shadow: none;
        }

        .emblem-motto {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            font-style: italic;
            color: var(--text-dim);
            text-align: center;
            position: relative;
            z-index: 1;
            letter-spacing: 1px;
        }

        .corner-mark {
            position: absolute;
            width: 24px;
            height: 24px;
        }
        .corner-mark.tl { top: 12px; left: 12px; border-top: 1px solid var(--gold-dark); border-left: 1px solid var(--gold-dark); opacity: 0.4; }
        .corner-mark.tr { top: 12px; right: 12px; border-top: 1px solid var(--gold-dark); border-right: 1px solid var(--gold-dark); opacity: 0.4; }
        .corner-mark.bl { bottom: 12px; left: 12px; border-bottom: 1px solid var(--gold-dark); border-left: 1px solid var(--gold-dark); opacity: 0.4; }
        .corner-mark.br { bottom: 12px; right: 12px; border-bottom: 1px solid var(--gold-dark); border-right: 1px solid var(--gold-dark); opacity: 0.4; }

        .about-content .section-desc {
            margin-bottom: 2.5rem;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .stat-item {
            padding: 1.4rem;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
        }

        .stat-item:hover {
            border-color: var(--glass-border-hover);
            background: var(--surface-hover);
            transform: translateY(-3px);
        }

        .stat-value {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--gold);
            line-height: 1;
            margin-bottom: 0.4rem;
        }

        .stat-label {
            font-size: 0.68rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* ═══ FEATURES ═══ */
        .features-layout {
            margin-top: 4rem;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .feature-card {
            padding: 2.5rem 2rem;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            backdrop-filter: blur(15px);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .feature-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 0%, rgba(201, 168, 76, 0.04), transparent 70%);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .feature-card:hover {
            border-color: var(--glass-border-hover);
            transform: translateY(-6px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 40px rgba(201, 168, 76, 0.03);
        }

        .feature-card:hover::before,
        .feature-card:hover::after { opacity: 1; }

        .feature-icon-wrap {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            background: rgba(201, 168, 76, 0.04);
            margin-bottom: 1.5rem;
            font-size: 1.2rem;
            transition: all 0.4s ease;
            position: relative;
            z-index: 1;
        }

        .feature-card:hover .feature-icon-wrap {
            border-color: var(--glass-border-hover);
            background: rgba(201, 168, 76, 0.08);
            box-shadow: 0 0 20px rgba(201, 168, 76, 0.1);
        }

        .feature-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
            position: relative;
            z-index: 1;
        }

        .feature-desc {
            font-size: 0.88rem;
            color: var(--text-dim);
            line-height: 1.75;
            font-weight: 300;
            position: relative;
            z-index: 1;
        }

        /* ═══ REALMS (COMMUNITIES) ═══ */
        .realms-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .realms-header .section-label {
            justify-content: center;
        }

        .realms-header .section-label::before { display: none; }

        .realms-header .section-desc {
            margin: 0 auto;
        }

        .realms-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .realm-card {
            text-align: center;
            padding: 3rem 2rem;
            border: 1px solid var(--glass-border);
            border-radius: 16px;
